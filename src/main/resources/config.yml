package com.sparkpets;

import org.bukkit.ChatColor;
import org.bukkit.command.Command;
import org.bukkit.command.CommandExecutor;
import org.bukkit.command.CommandSender;
import org.bukkit.entity.Player;
import org.bukkit.plugin.java.JavaPlugin;

public final class SparkPets extends JavaPlugin implements CommandExecutor {

    @Override
    public void onEnable() {
        saveDefaultConfig();
        getCommand("pet").setExecutor(this);
        getLogger().info("SparkPets Plugin has been enabled!");
    }

    @Override
    public void onDisable() {
        getLogger().info("SparkPets Plugin has been disabled!");
    }

    @Override
    public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
        if (sender instanceof Player player) {
            String prefix = getConfig().getString("prefix", "&e[SparkPets] ");
            player.sendMessage(ChatColor.translateAlternateColorCodes('&', prefix + "&aYour pet system is active!"));
            return true;
        }
        sender.sendMessage("Only players can execute this command.");
        return true;
    }
}
